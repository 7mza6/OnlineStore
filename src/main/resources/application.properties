spring.application.name=onlinestore

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/online-store
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-super-secret-key-to-something-long-and-random-in-prod
app.jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=info,health

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

